<sly data-sly-use.model="com.outwiththenest.core.models.DiscoveryListingModel"
     data-sly-use.cards="cards.html"/>

<section class="cmp-discovery-listing">
    <div class="cmp-discovery-listing__inner">

        <header class="cmp-discovery-listing__header">
            <h2 class="cmp-discovery-listing__title">
                ${properties.title || 'Places to explore'}
            </h2>

            <p class="cmp-discovery-listing__count"
               data-sly-test="${model.showCount}">
                ${model.count} places to discover
            </p>
        </header>

        <sly data-sly-call="${cards.grid @ cards=model.cards}"/>
    </div>
</section>

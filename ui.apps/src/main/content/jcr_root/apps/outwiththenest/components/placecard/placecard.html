<sly data-sly-use.templates="core/wcm/components/commons/v1/templates.html"
     data-sly-test.hasContent="${properties.title && properties.fileReference && properties.pagePath}"/>

<article class="cmp-place-card" data-sly-test="${hasContent}">
    <a class="cmp-place-card__link"
       href="${properties.pagePath @ extension='html'}">

        <img class="cmp-place-card__image"
             src="${properties.fileReference}"
             alt="${properties.imageAlt || ''}"
             loading="lazy"
             decoding="async"
             width="800"
             height="900">

        <div class="cmp-place-card__panel">
            <div class="cmp-place-card__text">
                <h3 class="cmp-place-card__title">
                    ${properties.title}
                </h3>

                <p class="cmp-place-card__meta">
                    <svg data-sly-test="${properties.location}"
                         class="cmp-place-card__pin"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true"
                         focusable="false">
                        <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                    </svg>

                    <span data-sly-test="${properties.location}">
                        ${properties.location}
                    </span>

                    <span data-sly-test="${properties.location && properties.environment}"
                          aria-hidden="true">·</span>

                    <span data-sly-test="${properties.environment}">
                        ${properties.environment}
                    </span>
                </p>
            </div>

            <span class="cmp-place-card__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     focusable="false">
                    <path d="m9 5 7 7-7 7"/>
                </svg>
            </span>
        </div>
    </a>
</article>

<sly data-sly-call="${templates.placeholder @ isEmpty=!hasContent}"/>

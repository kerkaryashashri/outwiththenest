<header class="cmp-nest-header" data-nest-header>
    <div class="cmp-nest-header__bar">

        <a class="cmp-nest-header__brand"
           href="${properties.homeUrl}">
            <img data-sly-test="${properties.logo}"
                 class="cmp-nest-header__logo"
                 src="${properties.logo}"
                 alt=""
                 width="56"
                 height="56">

            <span class="cmp-nest-header__name">
                ${properties.brandName || 'Out With The Nest'}
            </span>
        </a>

        <button class="cmp-nest-header__toggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">
            <span aria-hidden="true">☰</span>
        </button>

        <div class="cmp-nest-header__backdrop" hidden></div>

        <div class="cmp-nest-header__panel">

            <div class="cmp-nest-header__mobile-heading">
                <span>Explore the Nest</span>

                <button class="cmp-nest-header__close"
                        type="button"
                        aria-label="Close navigation menu">
                    <span aria-hidden="true">×</span>
                </button>
            </div>

            <div class="cmp-nest-header__navigation">
                <sly data-sly-resource="${'navigation' @
                    resourceType='outwiththenest/components/navigation'}">
                </sly>
            </div>

            <div class="cmp-nest-header__tools">
                <div class="cmp-nest-header__language"
                     data-sly-test="${properties.showLanguage}">
                    <sly data-sly-resource="${'language' @
                        resourceType='outwiththenest/components/languagenavigation'}">
                    </sly>
                </div>

                <div class="cmp-nest-header__search">
                    <sly data-sly-resource="${'search' @
                        resourceType='outwiththenest/components/search'}">
                    </sly>
                </div>
            </div>

        </div>
    </div>
</header>
